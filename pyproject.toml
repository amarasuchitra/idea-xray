[project]
name = "idea-xray"
version = "0.1.0"
description = "Check a startup idea against what already exists, what died, and what users complain about, before you build."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "respx==0.22.0", "ruff==0.8.4"]

[project.scripts]
idea-xray = "idea_xray.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["idea_xray", "idea_xray.sources"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["idea_xray"]
