name: Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: site, cancel-in-progress: true}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: bash scripts/build_site.sh
      - name: Publish to the gh-pages branch
        run: |
          cd _site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "idea-xray" && git config user.email "idea-xray@users.noreply.github.com"
          git add -A && git commit -qm "Website from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
